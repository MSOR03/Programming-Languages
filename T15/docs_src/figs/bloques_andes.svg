<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Arial, Helvetica, sans-serif" font-size="10.5">
<text x="320" y="16" text-anchor="middle" font-size="13" font-weight="bold">ANDES-64 — Industrias Andinas de Cómputo</text>
<rect x="20" y="30" width="330" height="170" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
<text x="30" y="46" font-weight="bold">CPU (máquina de registros, 64 bits)</text>
<rect x="30" y="56" width="150" height="62" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="105" y="71" text-anchor="middle" font-weight="bold">Unidad de control</text>
<text x="105" y="87" text-anchor="middle">PC, IR</text>
<text x="105" y="100" text-anchor="middle">fetch – decode – execute</text>
<rect x="190" y="56" width="150" height="62" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="265" y="71" text-anchor="middle" font-weight="bold">ALU</text>
<text x="265" y="87" text-anchor="middle">operaciones enteras</text>
<text x="265" y="100" text-anchor="middle">actualiza banderas</text>
<rect x="30" y="126" width="150" height="66" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="105" y="141" text-anchor="middle" font-weight="bold">Registros</text>
<text x="105" y="157" text-anchor="middle">R0–R15 de 64 bits</text>
<text x="105" y="170" text-anchor="middle">R13 = SP, R14 = LR</text>
<text x="105" y="183" text-anchor="middle">MAR, MDR</text>
<rect x="190" y="126" width="150" height="66" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="265" y="141" text-anchor="middle" font-weight="bold">Banderas</text>
<text x="265" y="157" text-anchor="middle">Z  N  C  V  I</text>
<text x="265" y="170" text-anchor="middle">(registro FR, 8 bits)</text>
<rect x="410" y="30" width="210" height="90" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="515" y="45" text-anchor="middle" font-weight="bold">Memoria principal</text>
<text x="515" y="61" text-anchor="middle">RAM 4 KB, por byte, big-endian</text>
<text x="515" y="74" text-anchor="middle">caché L1 128 B + L2 512 B</text>
<text x="515" y="87" text-anchor="middle">pila en RAM (crece hacia abajo)</text>
<rect x="410" y="140" width="210" height="60" fill="#ffffff" stroke="#000" stroke-width="1"/>
<text x="515" y="155" text-anchor="middle" font-weight="bold">Unidad de E/S</text>
<text x="515" y="171" text-anchor="middle">IN / OUT (modos D H C F)</text>
<text x="515" y="184" text-anchor="middle">NIC: NSEND / NRECV</text>
<line x1="20" x2="620" y1="235" y2="235" stroke="#000" stroke-width="3"/>
<text x="24" y="231">Bus de datos (64 bits)</text>
<line x1="20" x2="620" y1="265" y2="265" stroke="#000" stroke-width="2"/>
<text x="24" y="261">Bus de direcciones (12 bits)</text>
<line x1="20" x2="620" y1="295" y2="295" stroke="#000" stroke-width="1"/>
<text x="24" y="291">Bus de control (12 señales)</text>
<line x1="185" x2="185" y1="200" y2="295" stroke="#000" stroke-dasharray="3 2"/>
<line x1="440" x2="440" y1="120" y2="295" stroke="#000" stroke-dasharray="3 2"/>
<line x1="515" x2="515" y1="200" y2="295" stroke="#000" stroke-dasharray="3 2"/>
<text x="520" y="318">NIC / radio → MANET</text>
<line x1="580" x2="580" y1="200" y2="310" stroke="#000" stroke-dasharray="1 2"/>
</svg>